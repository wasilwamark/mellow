image: archlinux
packages:
  - go
  - goreleaser
sources:
  - https://git.sr.ht/~wasilwa/mellow

artifacts:
  - mellow-release.tar.gz
tasks:
  - setup: |
      cd mellow
      go mod download
  - build: |
      cd mellow
      go build ./...
  - release: |
      cd mellow
      if git describe --exact-match --tags HEAD >/dev/null 2>&1 && [[ "$(git describe --exact-match --tags HEAD)" == v* ]]; then
        goreleaser release --clean --skip=publish
        tar -czf ../mellow-release.tar.gz dist/
      else
        goreleaser build --clean --snapshot
      fi
